name: Deploy Backend (.NET 8 -> ECS Fargate Spot)

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: physical-fitness-backend
  ECS_CLUSTER: physical-fitness-cluster
  ECS_SERVICE: physical-fitness-backend-service
  ECS_TASK_DEFINITION: .aws/backend-task-definition.json
  CONTAINER_NAME: physical-fitness-backend

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticar no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag e Push da Imagem Backend para o ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Configurar Permissões CloudWatch e Role ECS
        run: |
          # 1. Pré-cria o grupo de logs para o container
          aws logs create-log-group --log-group-name /ecs/physical-fitness-backend 2>/dev/null || true

          # 2. Garante as permissões de logs na role de execução
          aws iam attach-role-policy --role-name ecsTaskExecutionRole --policy-arn arn:aws:iam::aws:policy/CloudWatchLogsFullAccess 2>/dev/null || true
          aws iam attach-role-policy --role-name ecsTaskExecutionRole --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy 2>/dev/null || true

      - name: Renderizar Nova Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Registrar e Atualizar Serviço no ECS Fargate Spot
        run: |
          # 1. Registra a task definition atualizada
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://${{ steps.task-def.outputs.task-definition }} --query "taskDefinition.taskDefinitionArn" --output text)
          echo "Task Definition registrada com sucesso: $TASK_DEF_ARN"

          # 2. Garante a regra da porta 5005 no Security Group
          DEFAULT_VPC=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query "Vpcs[0].VpcId" --output text)
          SG=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$DEFAULT_VPC" "Name=group-name,Values=default" --query "SecurityGroups[0].GroupId" --output text)
          aws ec2 authorize-security-group-ingress --group-id $SG --protocol tcp --port 5005 --cidr 0.0.0.0/0 2>/dev/null || true

          # 3. Atualiza o serviço no ECS
          echo "Atualizando o serviço $ECS_SERVICE no cluster $ECS_CLUSTER..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition $TASK_DEF_ARN \
            --desired-count 1 \
            --force-new-deployment

          # 4. Monitora a inicialização da tarefa
          echo "Monitorando a inicialização da aplicação..."
          SUCCESS=0
          for i in {1..20}; do
            RUNNING=$(aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} --query "services[0].runningCount" --output text)
            echo "Tentativa $i/20: Tarefas ativas = $RUNNING"

            if [ "$RUNNING" -ge 1 ]; then
              echo "✅ Backend em execução com sucesso no Fargate Spot!"
              SUCCESS=1
              break
            fi

            # Diagnóstico caso alguma tarefa tenha parado
            STOPPED_TASKS=$(aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --desired-status STOPPED --query "taskArns[:1]" --output text 2>/dev/null || true)
            if [ -n "$STOPPED_TASKS" ] && [ "$STOPPED_TASKS" != "None" ]; then
              REASON=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks $STOPPED_TASKS --query "tasks[0].stoppedReason" --output text 2>/dev/null || true)
              CONTAINER_REASON=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks $STOPPED_TASKS --query "tasks[0].containers[0].reason" --output text 2>/dev/null || true)
              echo "ℹ️ Motivo de parada recente: $REASON ($CONTAINER_REASON)"
            fi

            sleep 15
          done

          if [ "$SUCCESS" -eq 0 ]; then
            echo "⚠️ O serviço ainda está inicializando as instâncias Spot."
          fi
